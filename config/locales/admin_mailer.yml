_:
  admin_mailer:
    delivery_list_email:
      attachments_paragraph:
        _en: Attached are the summary file (XLSX) and the sheets (PDF) for the delivery on {{ delivery.date }}.
        _fr: Voici, en pièces jointes, le fichier récapitulatif (XLSX) et les fiches (PDF) pour la livraison du {{ delivery.date }}.
        _de: Hier sind als Anhänge die Zusammenfassung (XLSX) und die Blätter (PDF) für die Lieferung am {{ delivery.date }}.
        _it: In allegato il file di riepilogo (XLSX) e i fogli (PDF) per la consegna {{ delivery.date }}.
        _nl: Bijgevoegd zijn het samenvattingsbestand (XLSX) en de lijsten (PDF) voor de levering op {{ delivery.date }}.
      delivery_page_button:
        _en: Access the delivery page
        _fr: Accéder à la page de la livraison
        _de: Zur Lieferungsseite gehen
        _it: Accedere alla pagina di consegna
        _nl: Toegang tot de leveringspagina
      greeting:
        _en: Hello {{ admin.name }},
        _fr: Salut {{ admin.name }},
        _de: Hallo {{ admin.name }},
        _it: Ciao {{ admin.name }},
        _nl: Hallo {{ admin.name }},
      subject:
        _en: Delivery list of %{date}
        _fr: Liste de livraison du %{date}
        _de: Lieferungsliste vom %{date}
        _it: Lista di consegna del %{date}
        _nl: Leveringslijst van %{date}
    demo_follow_up_email:
      exploration_paragraph:
        _en: How is your exploration of the CSA Admin demo going? I hope the program seems to meet your needs. I'd love to hear your first impressions.
        _fr: Comment se passe votre découverte de la démo de CSA Admin? J'espère que le programme semble répondre à vos besoins. J'aimerais beaucoup connaître vos premières impressions.
        _de: Wie läuft die Erkundung der CSA Admin Demo? Ich hoffe, das Programm scheint den Anforderungen zu entsprechen. Ich würde mich über erste Eindrücke freuen.
        _it: Come procede l'esplorazione della demo di CSA Admin? Spero che il programma sembri rispondere alle vostre esigenze. Mi piacerebbe molto conoscere le vostre prime impressioni.
        _nl: Hoe gaat het verkennen van de CSA Admin-demo? Hopelijk lijkt het programma aan de behoeften te voldoen. Ik hoor graag de eerste indrukken.
      greeting:
        _en: Hello {{ admin.name }},
        _fr: Salut {{ admin.name }},
        _de: Hallo {{ admin.name }},
        _it: Ciao {{ admin.name }},
        _nl: Hallo {{ admin.name }},
      questions_paragraph:
        _en: If you have any questions, would like a guided tour, or want to discuss how CSA Admin could work for your CSA, just reply to this email. I'm happy to help.
        _fr: Si vous avez des questions, souhaitez une visite guidée ou voulez discuter de la façon dont CSA Admin pourrait fonctionner pour votre ACP, répondez simplement à cet e-mail. Je suis là pour vous aider.
        _de: Bei Fragen, für eine geführte Tour oder um zu besprechen, wie CSA Admin für die Solawi funktionieren könnte, einfach auf diese E-Mail antworten. Ich helfe gerne.
        _it: Se avete domande, desiderate una visita guidata o volete discutere di come CSA Admin potrebbe funzionare per la vostra ACP, rispondete semplicemente a questa e-mail. Sarò felice di aiutarvi.
        _nl: Bij vragen, voor een rondleiding of om te bespreken hoe CSA Admin voor de CSA kan werken, gewoon deze e-mail beantwoorden. Ik help graag.
      setup_button:
        _en: Setup
        _fr: Mise en place
        _de: Einrichtung
        _it: Configurazione
        _nl: Configuratie
      setup_paragraph:
        _en: 'If you''re ready to get started, the <a href="{{ setup_handbook_url }}">Setup</a> handbook page explains the few steps needed:'
        _fr: 'Si vous êtes prêt·e à vous lancer, la page <a href="{{ setup_handbook_url }}">Mise en place</a> du manuel explique les quelques étapes nécessaires:'
        _de: 'Wer gleich loslegen möchte, findet auf der Handbuchseite <a href="{{ setup_handbook_url }}">Einrichtung</a> die wenigen nötigen Schritte:'
        _it: 'Se siete pronti a iniziare, la pagina <a href="{{ setup_handbook_url }}">Configurazione</a> del manuale spiega i pochi passaggi necessari:'
        _nl: 'Om meteen te beginnen, staan op de handleidingpagina <a href="{{ setup_handbook_url }}">Configuratie</a> de paar benodigde stappen:'
      subject:
        _en: How's it going with the demo?
        _fr: Comment ça se passe avec la démo?
        _de: Wie läuft es mit der Demo?
        _it: Come va con la demo?
        _nl: Hoe gaat het met de demo?
    ebics_setup_finalized_email:
      finalized_paragraph:
        _en: 'Good news: the bank has activated the EBICS connection.'
        _fr: 'Bonne nouvelle: la banque a activé la connexion EBICS.'
        _de: 'Gute Nachricht: Die Bank hat die EBICS-Verbindung aktiviert.'
        _it: 'Buone notizie: la banca ha attivato la connessione EBICS.'
        _nl: 'Goed nieuws: de bank heeft de EBICS-verbinding geactiveerd.'
      greeting:
        _en: Hello {{ admin.name }},
        _fr: Salut {{ admin.name }},
        _de: Hallo {{ admin.name }},
        _it: Ciao {{ admin.name }},
        _nl: Hallo {{ admin.name }},
      payment_import_paragraph:
        _en: The EBICS connection is active. Payment automation health is shown in the bank connection settings.
        _fr: La connexion EBICS est active. L'état de l'automatisation des paiements est affiché dans les paramètres de connexion bancaire.
        _de: Die EBICS-Verbindung ist aktiv. Der Status der Zahlungsautomatisierung wird in den Einstellungen der Bankverbindung angezeigt.
        _it: La connessione EBICS è attiva. Lo stato dell'automazione dei pagamenti è mostrato nelle impostazioni della connessione bancaria.
        _nl: De EBICS-verbinding is actief. De status van de betalingsautomatisering wordt getoond in de instellingen voor de bankverbinding.
      settings_button:
        _en: Review bank connection settings
        _fr: Consulter les paramètres de connexion bancaire
        _de: Einstellungen der Bankverbindung prüfen
        _it: Consultare le impostazioni della connessione bancaria
        _nl: Instellingen van de bankverbinding bekijken
      subject:
        _en: EBICS setup finalized
        _fr: Mise en place EBICS finalisée
        _de: EBICS-Einrichtung abgeschlossen
        _it: Configurazione EBICS finalizzata
        _nl: EBICS-configuratie afgerond
    ebics_setup_submitted_email:
      daily_check_paragraph:
        _en: CSA Admin will check every night whether the bank has activated the connection.
        _fr: CSA Admin vérifiera chaque nuit si la banque a activé la connexion.
        _de: CSA Admin prüft jede Nacht, ob die Bank die Verbindung aktiviert hat.
        _it: CSA Admin verificherà ogni notte se la banca ha attivato la connessione.
        _nl: CSA Admin controleert elke nacht of de bank de verbinding heeft geactiveerd.
      greeting:
        _en: Hello {{ admin.name }},
        _fr: Salut {{ admin.name }},
        _de: Hallo {{ admin.name }},
        _it: Ciao {{ admin.name }},
        _nl: Hallo {{ admin.name }},
      letter_button:
        _en: Download initialization letter
        _fr: Télécharger la lettre d'initialisation
        _de: Initialisierungsbrief herunterladen
        _it: Scaricare la lettera di inizializzazione
        _nl: Initialisatiebrief downloaden
      send_letter_paragraph:
        _en: Print and sign the letter, then send it to the bank so the EBICS access can be activated.
        _fr: Imprimez et signez la lettre, puis envoyez-la à la banque afin que l'accès EBICS puisse être activé.
        _de: Den Brief ausdrucken, unterschreiben und an die Bank senden, damit der EBICS-Zugang aktiviert werden kann.
        _it: Stampate e firmate la lettera, poi inviatela alla banca affinché l'accesso EBICS possa essere attivato.
        _nl: De brief afdrukken, ondertekenen en naar de bank sturen, zodat de EBICS-toegang kan worden geactiveerd.
      settings_button:
        _en: Review bank connection settings
        _fr: Consulter les paramètres de connexion bancaire
        _de: Einstellungen der Bankverbindung prüfen
        _it: Consultare le impostazioni della connessione bancaria
        _nl: Instellingen van de bankverbinding bekijken
      subject:
        _en: EBICS setup started
        _fr: Mise en place EBICS démarrée
        _de: EBICS-Einrichtung gestartet
        _it: Configurazione EBICS avviata
        _nl: EBICS-configuratie gestart
      submitted_paragraph:
        _en: The EBICS setup was submitted successfully.
        _fr: La mise en place EBICS a été transmise avec succès.
        _de: Die EBICS-Einrichtung wurde erfolgreich übermittelt.
        _it: La configurazione EBICS è stata inviata correttamente.
        _nl: De EBICS-configuratie is succesvol verzonden.
    invitation_email:
      admin_account_paragraph:
        _en: An admin account for {{ organization.name }} has been created. Use your email (<strong>{{ admin.email }}</strong>) to log in.
        _fr: Un compte admin pour {{ organization.name }} vient de vous être créé. Utilisez votre adresse e-mail (<strong>{{ admin.email }}</strong>) pour vous connecter.
        _de: Ein Admin-Konto für {{ organization.name }} wurde gerade erstellt. Bitte mit der E-Mail-Adresse (<strong>{{ admin.email }}</strong>) anmelden.
        _it: È stato appena creato un account amministratore per {{ organization.name }}. Utilizzate il vostro indirizzo e-mail (<strong>{{ admin.email }}</strong>) per accedere.
        _nl: Er is een admin-account voor {{ organization.name }} aangemaakt. Gebruik het e-mailadres (<strong>{{ admin.email }}</strong>) om in te loggen.
      admin_button:
        _en: Access the admin of {{ organization.name }}
        _fr: Accéder à l'admin de {{ organization.name }}
        _de: Zum Admin von {{ organization.name }} gehen
        _it: Accedere all'admin di {{ organization.name }}
        _nl: Toegang tot de admin van {{ organization.name }}
      demo_button:
        _en: Access the demo
        _fr: Accéder à la démo
        _de: Zur Demo
        _it: Accedere alla demo
        _nl: Naar de demo
      demo_explore_paragraph:
        _en: Your account is ready. Feel free to click around, create members, and experiment with the settings. Everything resets weekly, so you can't break anything.
        _fr: Votre compte est prêt. N'hésitez pas à explorer, à créer des membres et à tester les réglages. Tout est réinitialisé chaque semaine, donc impossible de casser quoi que ce soit.
        _de: Das Konto ist bereit. Einfach durchklicken, Mitglieder erstellen und die Einstellungen ausprobieren. Alles wird wöchentlich zurückgesetzt, es kann also nichts kaputt gehen.
        _it: Il vostro account è pronto. Esplorate liberamente, create soci e provate le impostazioni. Tutto viene reimpostato ogni settimana, quindi non potete rompere nulla.
        _nl: Het account is klaar. Gerust rondklikken, leden aanmaken en de instellingen uitproberen. Alles wordt wekelijks gereset, dus er kan niets kapotgaan.
      demo_questions_paragraph:
        _en: If you have any questions or would like a personal walkthrough, just reply to this email. I'm always happy to help.
        _fr: Si vous avez des questions ou souhaitez une présentation personnalisée, répondez simplement à cet e-mail. Je suis là pour vous aider.
        _de: Bei Fragen oder für eine persönliche Führung einfach auf diese E-Mail antworten. Ich helfe immer gerne.
        _it: Se avete domande o desiderate una presentazione personalizzata, rispondete semplicemente a questa e-mail. Sarò felice di aiutarvi.
        _nl: Bij vragen of voor een persoonlijke rondleiding gewoon deze e-mail beantwoorden. Ik help altijd graag.
      demo_welcome_paragraph:
        _en: I'm Thibaud, the developer of CSA Admin. Welcome to the demo!
        _fr: Je suis Thibaud, le développeur de CSA Admin. Bienvenue dans la démo!
        _de: Ich bin Thibaud, der Entwickler von CSA Admin. Willkommen zur Demo!
        _it: Sono Thibaud, lo sviluppatore di CSA Admin. Benvenuti nella demo!
        _nl: Ik ben Thibaud, de ontwikkelaar van CSA Admin. Welkom bij de demo!
      greeting:
        _en: Hello {{ admin.name }},
        _fr: Salut {{ admin.name }},
        _de: Hallo {{ admin.name }},
        _it: Ciao {{ admin.name }},
        _nl: Hallo {{ admin.name }},
      subject:
        _en: Invitation to the %{org} admin
        _fr: Invitation à l'admin de %{org}
        _de: Einladung an den %{org} Admin
        _it: Invito all'admin di %{org}
        _nl: Uitnodiging voor de admin van %{org}
      subject_demo:
        _en: Invitation to the CSA Admin demo
        _fr: Invitation à la démo de CSA Admin
        _de: Einladung zur CSA Admin Demo
        _it: Invito alla demo di CSA Admin
        _nl: Uitnodiging voor de CSA Admin demo
