      index:
        absences_included_explanation_html:
          one:
            _en: Your membership includes <b>1 absence</b>. If unused, it is provisionally assigned to the last delivery.
            _fr: Votre abonnement prévoit <b>1 absence</b>. Si elle n'est pas utilisée, elle est provisoirement attribuée à la dernière livraison.
            _de: Dein Abonnement beinhaltet <b>1 Abwesenheit</b>. Wenn Du sie nicht nutzt, wird sie provisorisch der letzten Lieferung zugewiesen.
            _it: Il tuo abbonamento prevede <b>1 assenza</b>. Se non la utilizzi, viene assegnata provvisoriamente all'ultima consegna.
            _nl: Je lidmaatschap omvat <b>1 afwezigheid</b>. Als je die niet gebruikt, wordt ze voorlopig aan de laatste levering toegewezen.
          other:
            _en: Your membership includes <b>%{count} absences</b>. Unused included absences are provisionally applied to the last deliveries.
            _fr: Votre abonnement prévoit <b>%{count} absences</b>. Les absences incluses non utilisées sont appliquées provisoirement sur les dernières livraisons.
            _de: Dein Abonnement beinhaltet <b>%{count} Abwesenheiten</b>. Ungenutzte inbegriffene Abwesenheiten werden provisorisch auf die letzten Lieferungen angewendet.
            _it: Il tuo abbonamento prevede <b>%{count} assenze</b>. Le assenze incluse non utilizzate vengono applicate provvisoriamente alle ultime consegne.
            _nl: Je lidmaatschap omvat <b>%{count} afwezigheden</b>. Ongebruikte inbegrepen afwezigheden worden voorlopig toegepast op de laatste leveringen.
        explanation_billed/bag:
          _en: During your absence, you can give your bag to friends, neighbors, or family. If this is not possible, please inform us of your absence using the form below. Your bag will then be shared among other members. These bags are not refunded.
          _fr: Lors de votre absence, le plus simple est de proposer votre sac à vos ami(e)s, voisin(e)s, famille, ... Si malheureusement ce n'est pas possible, merci d'annoncer votre absence à l'aide du formulaire ci-dessous. Votre sac sera alors partagé avec les autres membres. Ces sacs ne sont pas remboursés.
          _de: Während Deiner Abwesenheit kannst Du gerne Deine Tasche an Freunde, Nachbarn oder Familie schenken. Wenn dies leider nicht möglich ist, sind wir Dir dankbar, uns über Deine Abwesenheit mit dem unten stehenden Formular zu informieren. Deine Tasche wird dann unter den anderen Mitgliedern geteilt. Diese Taschen werden nicht zurückerstattet.
          _it: In caso di assenza, la soluzione più semplice, è quella di proporre la tua borsa ad amici o parenti, ... Se ciò non è possibile, grazie per farcelo sapere indicando la tua assenza con il modulo sottostante. La tua borsa non verra sprecata. Queste borse non saranno rimborsate.
          _nl: Tijdens je afwezigheid kun je je tas aan vrienden, buren of familie geven. Als dat niet mogelijk is, informeer ons dan via het onderstaande formulier over je afwezigheid. Je tas wordt dan gedeeld met andere leden. Deze tassen worden niet terugbetaald.
        explanation_billed/basket:
          _en: During your absence, you can give your basket to friends, neighbors, or family. If this is not possible, please inform us of your absence using the form below. Your basket will then be shared among other members. These baskets are not refunded.
