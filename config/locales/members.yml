        explanation/bag:
          _en: Sharing contact information allows members of a depot to contact each other to arrange the pickup of their bags if they are occasionally prevented. You must agree to share your contact information (name, address, and phone number) to access the data of members who have also decided to do so.
          _fr: Le copaniérage (covoiturage pour panier) permet aux membres d'un dépôt de se contacter afin d'organiser la récupération de leurs sacs en cas d'empêchement occasionnel. Vous devez accepter de partager vos coordonnées (nom, adresse et téléphone) afin d'avoir accès à celles des membres qui ont décidé de faire de même.
          _de: Die gemeinsame Nutzung von Kontaktdaten ermöglicht es den Mitgliedern eines Depots, sich gegenseitig zu kontaktieren, um die Abholung ihrer Taschen zu arrangieren, falls sie gelegentlich verhindert sein sollten. Du musst der Weitergabe Deiner Kontaktdaten (Name, Adresse und Telefonnummer) zustimmen, um Zugang zu den Daten von Mitgliedern zu erhalten, die sich dazu entschlossen haben, dies ebenfalls zu tun.
          _it: La condivisione delle informazioni di contatto permette ai soci di un punto di ritiro di contattarsi a vicenda per organizzare la consegna delle loro borse nel caso in cui siano occasionalmente impossibilitati a partecipare. Devi accettare di condividere le tue informazioni di contatto (nome, indirizzo e numero di telefono) per avere accesso a quelle dei soci che hanno deciso di fare lo stesso.
          _nl: Het delen van contactgegevens stelt leden van een depot in staat om elkaar te contacteren om de afhaling van hun tassen te regelen als zij af en toe verhinderd zijn. Je moet instemmen met het delen van je contactgegevens (naam, adres en telefoonnummer) om toegang te krijgen tot de gegevens van leden die ook hebben besloten dit te doen.
