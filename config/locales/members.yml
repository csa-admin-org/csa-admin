          _nl: Tijdens je afwezigheid kun je je mand aan vrienden, buren of familie geven. Als dat niet mogelijk is, informeer ons dan via het onderstaande formulier over je afwezigheid. Je mand wordt dan gedeeld met andere leden. Deze manden worden niet terugbetaald.
