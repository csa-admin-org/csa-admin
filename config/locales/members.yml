            _it: Hai ancora <b>1 spostamento di borsa</b> disponibile. Una volta creata un'assenza, puoi spostare la consegna a un'altra data.
            _nl: Je hebt nog <b>1 tasverschuiving</b> over. Zodra een afwezigheid is aangemaakt, kun je de levering naar een andere datum verschuiven.
