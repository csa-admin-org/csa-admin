          _nl: Om organisatorische redenen kunnen inschrijvingen voor werkdagen die plaatsvinden binnen %{days_count} dagen niet meer worden geannuleerd. Neem bij verhindering %{contact_link}.
        coming_activity_participation_cannot_be_cancel_explanation/halfday_work_html:
