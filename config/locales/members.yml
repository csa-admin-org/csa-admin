        absences_included_footnote_html:
          _en: Included absences can also be shifted. The shifted delivery will be billed, and your included absence remains available.
          _fr: Les absences incluses peuvent aussi être déplacées. La livraison déplacée sera facturée et votre absence incluse reste disponible.
          _de: Auch inbegriffene Abwesenheiten können verschoben werden. Die verschobene Lieferung wird in Rechnung gestellt und Deine inbegriffene Abwesenheit bleibt verfügbar.
          _it: Anche le assenze incluse possono essere spostate. La consegna spostata sarà fatturata e la tua assenza inclusa rimane disponibile.
          _nl: Ook inbegrepen afwezigheden kunnen worden verschoven. De verschoven levering wordt gefactureerd en je inbegrepen afwezigheid blijft beschikbaar.
