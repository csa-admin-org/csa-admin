          _en: During your absence, you can give your crate to friends, neighbors, or family. If this is not possible, please inform us of your absence using the form below. Your crate will then be shared among other members. These crates are not refunded.
          _fr: Lors de votre absence, le plus simple est de proposer votre cagette à vos ami(e)s, voisin(e)s ou à votre famille. Si ce n'est pas possible, merci d'annoncer votre absence à l'aide du formulaire ci-dessous. Votre cagette sera alors partagée avec les autres membres. Ces cagettes ne sont pas remboursées.
          _de: Während Deiner Abwesenheit kannst Du gerne Deine Kiste an Freunde, Nachbarn oder Familie schenken. Wenn dies nicht möglich ist, informiere uns bitte über Deine Abwesenheit mit dem untenstehenden Formular. Deine Kiste wird dann unter den anderen Mitgliedern geteilt. Diese Kisten werden nicht zurückerstattet.
          _it: Durante la tua assenza, puoi regalare la tua cassetta ad amici, vicini o familiari. Se non è possibile, comunicaci la tua assenza tramite il modulo qui sotto. La tua cassetta verrà condivisa con gli altri soci. Queste cassette non vengono rimborsate.
          _nl: Tijdens je afwezigheid kun je je krat aan vrienden, buren of familie geven. Als dat niet mogelijk is, meld je afwezigheid dan via het onderstaande formulier. Je krat wordt dan gedeeld met andere leden. Deze kratten worden niet terugbetaald.
        explanation_billed/package:
          _en: During your absence, you can give your package to friends, neighbors, or family. If this is not possible, please inform us of your absence using the form below. Your package will then be shared among other members. These packages are not refunded.
          _fr: Lors de votre absence, le plus simple est de proposer votre colis à vos ami(e)s, voisin(e)s, famille, ... Si malheureusement ce n'est pas possible, merci d'annoncer votre absence à l'aide du formulaire ci-dessous. Votre colis sera alors partagé avec les autres membres. Ces colis ne sont pas remboursés.
          _de: Während Deiner Abwesenheit kannst Du gerne Dein Paket an Freunde, Nachbarn oder Familie schenken. Wenn dies leider nicht möglich ist, sind wir Dir dankbar, uns über Deine Abwesenheit mit dem unten stehenden Formular zu informieren. Dein Paket wird dann unter den anderen Mitgliedern geteilt. Diese Pakete werden nicht zurückerstattet.
          _it: In caso di assenza, la soluzione più semplice, è quella di proporre il tuo pacco ad amici o parenti, ... Se ciò non è possibile, grazie per farcelo sapere indicando la tua assenza con il modulo sottostante. Il tuo pacco non verrà sprecato. Questi pacchi non saranno rimborsati.
          _nl: Tijdens je afwezigheid kun je je pakket aan vrienden, buren of familie geven. Als dat niet mogelijk is, informeer ons dan via het onderstaande formulier over je afwezigheid. Je pakket wordt dan gedeeld met andere leden. Deze pakketten worden niet terugbetaald.
        explanation_billed/share:
          _en: During your absence, you can give your share to friends, neighbors, or family. If this is not possible, please inform us of your absence using the form below. Your share will then be shared among other members. These shares are not refunded.
          _fr: Lors de votre absence, le plus simple est de proposer votre part à vos ami(e)s, voisin(e)s, famille, ... Si malheureusement ce n'est pas possible, merci d'annoncer votre absence à l'aide du formulaire ci-dessous. Votre part sera alors partagée avec les autres membres. Ces parts ne sont pas remboursées.
          _de: Während Deiner Abwesenheit kannst Du gerne Deinen Anteil an Freunde, Nachbarn oder Familie schenken. Wenn dies leider nicht möglich ist, sind wir Dir dankbar, uns über Deine Abwesenheit mit dem unten stehenden Formular zu informieren. Dein Anteil wird dann unter den anderen Mitgliedern geteilt. Diese Anteile werden nicht zurückerstattet.
          _it: In caso di assenza, la soluzione più semplice, è quella di proporre la tua parte ad amici o parenti, ... Se ciò non è possibile, grazie per farcelo sapere indicando la tua assenza con il modulo sottostante. La tua parte non verra sprecata. Queste parti non saranno rimborsate.
          _nl: Tijdens je afwezigheid kun je je deel aan vrienden, buren of familie geven. Als dat niet mogelijk is, informeer ons dan via het onderstaande formulier over je afwezigheid. Je deel wordt dan gedeeld met andere leden. Deze delen worden niet terugbetaald.
