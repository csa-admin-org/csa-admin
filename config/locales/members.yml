          _nl: Tijdens je afwezigheid kun je je zak aan vrienden, buren of familie geven. Als dat niet mogelijk is, informeer ons dan via het onderstaande formulier over je afwezigheid. Je zak wordt dan gedeeld met andere leden. Deze zakken worden niet terugbetaald.
