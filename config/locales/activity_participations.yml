_:
  activity_participations:
    batch_action:
      reject:
        flash:
          alert:
            _en: Future participations cannot yet be rejected
            _fr: Les participations à venir ne peuvent pas encore être refusées
            _de: Künftige Teilnahmen können noch nicht abgelehnt werden
            _it: Le partecipazioni future non possono ancora essere rifiutate
            _nl: Toekomstige deelnames kunnen nog niet worden afgewezen
      validate:
        flash:
          alert:
            _en: Future participations cannot yet be validated
            _fr: Les participations à venir ne peuvent pas encore être validées
            _de: Künftige Teilnahmen können noch nicht bestätigt werden
            _it: Le partecipazioni future non possono ancora essere confermate
            _nl: Toekomstige deelnames kunnen nog niet worden gevalideerd
    form_detail:
      max:
        _en: Increase the requested number (-%{price}/participation).
        _fr: Augmenter le nombre demandé (-%{price}/participation).
        _de: Anzahl der angeforderten Teilnahmen erhöhen (-%{price}/Teilnahme).
        _it: Aumentare il numero richiesto (-%{price}/partecipazione).
        _nl: Het gevraagde aantal verhogen (-%{price}/deelname).
      min:
        _en: Reduce the requested number (+%{price}/participation).
        _fr: Réduire le nombre demandé (+%{price}/participation).
        _de: Anzahl der angeforderten Teilnahmen reduzieren (+%{price}/Teilnahme).
        _it: Ridurre il numero richiesto (+%{price}/partecipazione).
        _nl: Het gevraagde aantal verlagen (+%{price}/deelname).
      min_max:
        _en: Adjust the requested number (+/- %{price}/participation).
        _fr: Ajuster le nombre demandé (+/- %{price}/participation).
        _de: Anzahl der angeforderten Teilnahmen anpassen (+/- %{price}/Teilnahme).
        _it: Regolare il numero richiesto (+/- %{price}/partecipazione).
        _nl: Het gevraagde aantal aanpassen (+/- %{price}/deelname).
