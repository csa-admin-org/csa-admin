        _it: Grazie di usare il modulo di richiesta di supporto (%{url}) direttamente nell'applicazione, così posso raccogliere le richieste in un unico posto.
        _nl: Het formulier voor ondersteuningsverzoeken (%{url}) rechtstreeks in de applicatie gebruiken, zodat de verzoeken op één plek binnenkomen.
