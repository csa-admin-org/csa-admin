        _en: Criteria
        _fr: Critères
        _de: Kriterien
        _it: Criteri
        _nl: Criteria
      criterias_explanation_html:
        _en: Use the Members section to select any members, including inactive ones. Use the Memberships section to select members with a membership. Criteria from both sections can be combined, but some mutually exclusive combinations may return no results, for example when pairing certain member states with restrictive membership filters.
        _fr: Utilisez la section Membres pour sélectionner tous les membres, y compris les inactifs. Utilisez la section Abonnements pour sélectionner les membres ayant un abonnement. Vous pouvez combiner les critères des deux sections, mais certaines combinaisons exclusives peuvent ne renvoyer aucun résultat, par exemple en associant certains états de membre à des filtres d'abonnement restrictifs.
        _de: Der Bereich Mitglieder dient dazu, beliebige Mitglieder einschliesslich inaktiver Mitglieder auszuwählen. Der Bereich Abonnements dient dazu, Mitglieder mit einem Abonnement auszuwählen. Kriterien aus beiden Bereichen können kombiniert werden; manche ausschliesslichen Kombinationen liefern jedoch keine Ergebnisse, etwa bestimmte Mitgliederstatus zusammen mit einschränkenden Abonnementfiltern.
        _it: La sezione Soci consente di selezionare qualsiasi socio, inclusi quelli inattivi. La sezione Abbonamenti consente di selezionare i soci con un abbonamento. I criteri delle due sezioni possono essere combinati, ma alcune combinazioni esclusive potrebbero non restituire risultati, ad esempio associando determinati stati del socio a filtri di abbonamento restrittivi.
        _nl: Via de sectie Leden kunnen alle leden, ook inactieve, worden geselecteerd. Via de sectie Lidmaatschappen kunnen leden met een lidmaatschap worden geselecteerd. Criteria uit beide secties kunnen worden gecombineerd, maar sommige uitsluitende combinaties leveren geen resultaten op, bijvoorbeeld bij een combinatie van bepaalde ledenstatussen met beperkende lidmaatschapsfilters.
      info_html:
        _en: Audience segments let you define reusable recipient rules for your newsletters. Use them when the standard audience options are not precise enough—for example, to reach members in a specific city, with a particular billing interval, or on a custom list.
        _fr: Les segments de destinataires vous permettent de définir des règles de sélection réutilisables pour vos newsletters. Utilisez-les lorsque les options standard ne sont pas assez précises, par exemple pour atteindre les membres d'une ville donnée, ayant un intervalle de facturation particulier ou figurant sur une liste personnalisée.
        _de: Mit Zielgruppensegmenten lassen sich wiederverwendbare Empfängerregeln für Newsletter definieren. Sie kommen zum Einsatz, wenn die Standardoptionen nicht präzise genug sind, etwa für Mitglieder einer bestimmten Stadt, mit einem bestimmten Abrechnungsintervall oder auf einer benutzerdefinierten Liste.
        _it: I segmenti di destinatari consentono di definire regole di selezione riutilizzabili per le newsletter. Sono utili quando le opzioni standard non sono abbastanza precise, ad esempio per raggiungere soci di una città specifica, con un particolare intervallo di fatturazione o presenti in un elenco personalizzato.
        _nl: Met doelgroepssegmenten kunnen herbruikbare selectiecriteria voor nieuwsbrieven worden ingesteld. Ze zijn nuttig wanneer de standaardopties niet precies genoeg zijn, bijvoorbeeld voor leden uit een specifieke stad, met een bepaald factureringsinterval of op een aangepaste lijst.
