# Column classification for anonymized tenant dumps.
# Every column in db/schema.rb must appear here. A new column fails
# test/lib/anonymized_dump/classification_test.rb until it is classified.
#
# Rules: keep, clear, set_false, empty_object, empty_array, drop,
# person_name, emails, email, phone, street, zip, city, iban, token,
# card_number, encrypt_null, encrypt_empty, encrypt_placeholder.
# action: drop empties the table. email_policy allow skips the
# disposable-domain scan for org-authored copy.
allowed_email_domain: mailinator.com
placeholder_api_token: anon-api-token
seed_salt: csa-admin-anonymized-v1
retention_days: 30
purge_rich_text_record_types:
  - Support::Message
  - Support::Ticket
drop_order:
  - active_storage_variant_records
  - active_storage_attachments
  - active_storage_blobs
  - invoice_items
  - invoices
  - mail_delivery_emails
  - mail_deliveries
  - demo_page_visits
  - sessions
  - support_messages
  - support_tickets
  - audits
  - email_suppressions
email_policy:
  allow:
    - organizations.email
    - organizations.email_default_from
    - organizations.email_signatures
    - organizations.email_footers
    - organizations.invoice_infos
    - organizations.invoice_footers
    - organizations.invoice_sepa_infos
    - organizations.delivery_pdf_footers
    - organizations.shop_delivery_pdf_footers
    - organizations.shop_invoice_infos
    - mail_templates.subjects
    - mail_templates.contents
    - newsletter_templates.titles
    - newsletter_templates.contents
    - newsletters.subjects
    - newsletters.template_contents
    - newsletters.signatures
    - newsletter_publications.payload
    - action_text_rich_texts.body
  disposable:
    - admins.email
    - basket_complements.emails
    - depots.emails
    - members.emails
    - members.billing_email
    - newsletters.from
    - search_entries.content_primary
    - search_entries.content_secondary
