name: Deploy

on:
  # Production deploy after CI on master. Job requires this repo, a successful
  # same-repo workflow_run, and checks out head_sha with persist-credentials: false.
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Production
    if: >-
      github.repository == 'csa-admin-org/csa-admin' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: production

    env:
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      ADMIN_KEY: ${{ secrets.CAP_ADMIN_KEY }}
      BUNDLE_FROZEN: true

    steps:
      - name: Check secrets
        run: |
          if [ -z "${RAILS_MASTER_KEY:-}" ] || [ -z "${ADMIN_KEY:-}" ]; then
            echo "Missing GitHub Environment secrets on 'production'."
            echo "Set RAILS_MASTER_KEY, CAP_ADMIN_KEY, and KAMAL_SSH_PRIVATE_KEY."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Ruby
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          MISE_AQUA_GITHUB_ATTESTATIONS: false
          MISE_DISABLE_TOOLS: node,aube,jactionlint,shellcheck

      - name: Install Kamal
        run: bundle install

      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Trust isle
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          {
            echo "Host *"
            echo "  StrictHostKeyChecking no"
            echo "  CheckHostIP no"
            echo "  UserKnownHostsFile /dev/null"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy
        run: |
          echo "Deploying $(git rev-parse HEAD)"
          bundle exec kamal deploy
