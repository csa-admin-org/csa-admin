name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_ENV: ci
  MISE_AQUA_GITHUB_ATTESTATIONS: false
  AUBE_STORE_DIR: ~/.local/share/mise/aube-store
  BUNDLE_FROZEN: true

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update apt
        run: sudo apt-get update -qq

      - name: Bootstrap
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          bootstrap: true
          cache_key: "{{default}}-${{ hashFiles('Gemfile.lock', 'aube-lock.yaml') }}"

      - name: Locales
        run: bin/locales check

      - name: Herb format
        run: bin/herb format . --check

      - name: Oxfmt
        run: bin/oxfmt --check

      - name: RuboCop
        run: bin/rubocop --parallel --format simple

      - name: Oxlint
        run: bin/oxlint app/javascript

      - name: Stylelint
        run: >
          bin/stylelint
          app/assets/stylesheets/**/*.css

      - name: Herb lint
        run: bin/herb lint . --github

      - name: Jactionlint
        run: bin/jactionlint

      - name: Shellcheck
        run: >
          bin/shellcheck
          .kamal/hooks/pre-deploy
          bin/docker-entrypoint

      - name: Solid Queue
        run: bin/jobs check

      - name: Check Migration Indexes
        uses: speedshop/ids_must_be_indexed@806dc7edb3fd4d9d562f59cac99a696de21564a5 # v1.2.3

  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update apt
        run: sudo apt-get update -qq

      - name: Bootstrap
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          bootstrap: true
          cache_key: "{{default}}-${{ hashFiles('Gemfile.lock', 'aube-lock.yaml') }}"

      - name: Bundler audit
        run: bin/bundler-audit check --update

      - name: Importmap
        run: bin/importmap audit

      - name: Brakeman
        run: bin/brakeman -f sarif -o results.sarif

      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update apt
        run: sudo apt-get update -qq

      - name: Bootstrap
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          bootstrap: true
          cache_key: "{{default}}-${{ hashFiles('Gemfile.lock', 'aube-lock.yaml') }}"

      - name: Set timezone
        run: echo "TZ=Europe/Zurich" >> "$GITHUB_ENV"

      - name: Prepare database
        env:
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/rails db:prepare

      - name: Herb check
        env:
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/rails herb:check

      - name: Rails
        env:
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/rails test:all

      - name: Seeds
        env:
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/rails db:seed:replant
