name: Security

on:
  schedule:
    - cron: "00 8 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_ENV: ci
  MISE_AQUA_GITHUB_ATTESTATIONS: false
  AUBE_STORE_DIR: ~/.local/share/mise/aube-store
  BUNDLE_FROZEN: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update apt
        run: sudo apt-get update -qq

      - name: Bootstrap
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          bootstrap: true
          cache_key: "{{default}}-${{ hashFiles('Gemfile.lock', 'aube-lock.yaml') }}"

      - name: Bundle Audit
        run: bin/bundler-audit check --update

      - name: Importmap Audit
        run: bin/importmap audit
