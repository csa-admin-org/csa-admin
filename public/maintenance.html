<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>Application Offline for Maintenance</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        font-family: ui-sans-serif, system-ui, sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: oklch(13% 0.028 261.7);
          color: #fff;
        }
      }

      .wrap {
        margin-inline: auto;
        padding: 1rem;
        text-align: center;
      }

      h1,
      .mark {
        margin: 0;
        font-size: 8rem;
        line-height: 1;
        font-weight: 800;
      }

      .mark {
        margin-top: 1rem;
      }

      .copy {
        margin: 2rem 0;
      }

      h2 {
        margin: 0 0 1rem;
        font-size: 1.5rem;
        font-weight: 400;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
      }

      button {
        cursor: pointer;
        appearance: none;
        border: 0;
        border-radius: 0.25rem;
        background: oklch(72.27% 0.192 149.6);
        padding: 0.25rem 0.5rem;
        font: inherit;
        font-size: 1.125rem;
        color: #fff;
      }

      button:hover {
        text-decoration: underline;
      }
      h1.mark {
        font-size: 8rem;
      }

      h2 {
        font-size: 3rem;
        font-weight: 800;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="mark">🚧</div>

      <div class="copy">
        <h2>Offline for Maintenance.</h2>

        <p>This application is undergoing maintenance right now. Please check back later.</p>
      </div>
    </div>
  </body>
</html>
